# 纯 CPU 检测：静态检查 + 报告渲染冒烟。
# 运行于 ubuntu-latest，不依赖 Ascend NPU / 真机产物。
# 说明：
#   - 真机验收（acceptance.sh / bench / profile）需要 Ascend NPU，不进此 CI；
#     在服务器手动触发，产物落 runs/accepted/。
#   - report-render-smoke 在 CI 内用最小 fixture 构造 gate/slo.json，
#     验证 report.py 能把判定渲染进 report.md（自包含、可复现，不污染 runs/）。
#   - 文档构建由 pages.yml 负责，本文件不重复。
name: CI (lint + report smoke)

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python 语法检查 (py_compile)
        run: |
          python -m py_compile $(git ls-files 'src/*.py')
      - name: 静态检查 (ruff)
        run: |
          pip install --no-compile ruff
          ruff check src/
      - name: Shell 语法检查 (bash -n)
        run: |
          for f in $(git ls-files 'scripts/*.sh' 'bin/*'); do bash -n "$f"; done

  report-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 报告渲染冒烟（report.py 纯 stdlib，无需 vllm）
        run: |
          set -euo pipefail
          fixture=/tmp/fake/accepted
          mkdir -p "$fixture/A1-FP16-PASS"
          cat > "$fixture/A1-FP16-PASS/gate.json" <<'JSON'
          { "gate": "PASS", "ok": true, "checks": [ { "name": "quality", "ok": true } ] }
          JSON
          cat > "$fixture/A1-FP16-PASS/slo.json" <<'JSON'
          { "formal": { "overall": { "slo_pass": true, "tenants_pass": 4, "tenants_total": 4 } } }
          JSON
          python src/report.py "$fixture"
          test -f "$fixture/A1-FP16-PASS/report.md"
          grep -q 'gate.*PASS'  "$fixture/A1-FP16-PASS/report.md"
          grep -q 'slo_pass'    "$fixture/A1-FP16-PASS/report.md"
          test -f "$fixture/index.md"
          echo "report-smoke OK"