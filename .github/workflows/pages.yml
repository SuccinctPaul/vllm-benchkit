# 构建 vllm-notes 文档并发布到 GitHub Pages。
# 前置：仓库 Settings → Pages → Source 选 "GitHub Actions"（一次性）。
# 触发：push 到目标分支（默认 feat/vllm-xcheck；如需改分支，改下方 on/push/branches）
# 说明：link_rewrite 插件是本地微包（mkdocs/），在构建步骤里 pip install -e 装上；
#       repo/branch 由 GitHub 自动注入 GITHUB_REPOSITORY / GITHUB_REF_NAME。
name: Build docs & deploy to Pages

on:
  push:
    branches:
      - feat/vllm-xcheck
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mkdocs-material + 本地插件
        run: |
          pip install --no-compile mkdocs-material
          pip install --no-compile -e ./mkdocs
      - uses: actions/configure-pages@v4
      - name: Build docs site
        run: mkdocs build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4