# cells/a2-struct.yaml —— A2 结构化输出（表附-3/表附-6）。
# OpenAI JSON Schema；逐 case 发送 Schema；backend=xgrammar（禁止 auto）。
meta:
  cell: a2-struct
  profile: A2-STRUCT-{precision}
  precisions: [FP16, W8A8]
  endpoint: /v1/chat/completions
  api: chat

model:
  family: Qwen2.5-14B-Instruct
  served_name: qwen2.5-14b-instruct-{precision}

server:
  gpu_memory_utilization: 0.85
  max_num_seqs: 16
  max_num_batched_tokens: 8192
  enable_prefix_caching: false
  enable_chunked_prefill: true
  capture_sizes: [1, 2, 4, 8, 16]
  compile_mode: vllm_compile
  enforce_eager: false
  cudagraph_mode: FULL_DECODE_ONLY
  cudagraph_num_of_warmups: 1
  # structured_outputs_backend=xgrammar 由 common.yaml 全局声明（表附-3：禁止 backend=auto）

sampling:
  ignore_eos: false
  max_tokens: null
  logprobs: false

workload:
  mode: poisson
  dataset: JSONSchemaBench      # 固定 64 例（JSON Schema Draft 2020-12）
  request_shape: {input_max: 2048, output_cap: 512}
  rates: [0.25, 0.5, 1, 1.5, 2, 3, 4]
  max_concurrency: 16
  caps: [150, 300, 600, 900, 1200, 1800, 2400]
  timeouts:
    warmup_s: 300              # 附-6 共同执行法：预热 5min
    capacity_s: 6300
    per_rate_s: 600
    per_request_s: 600
    drain_cooldown_s: 60
  primary_metric: "schema-valid rate + task success rate (perf full report)"
  slo:                      # 附-8 A2 绝对 SLO（ms）
    ttft: {mean_ms: 1000, p95_ms: 2000, p99_ms: 4000}
    tpot: {mean_ms: 40, p95_ms: 60, p99_ms: 80}