# vllm-benchkit — uv 管理的依赖（纯第三方运行时清单）
# 基准版本: vLLM core + vllm-ascend @ releases/v0.18.0; CANN 9.0.0; Atlas 910B2
# 版本栈按 vllm-ascend 官方 pin（torch 2.9.0 / torch-npu 2.9.0.post2），见 ADR-0002。
#
# 本文件只声明"纯第三方运行时依赖"。vllm / vllm-ascend 属于本仓库自产组件，
# 其远程仓库路径、branch/commit 的唯一事实来源是 config/topology.yaml（ADR-0006），
# 由 scripts/deploy.sh 按清单推导路径并做 editable 安装，本文件不再承载仓库路径。
[project]
name = "vllm-benchkit"
version = "0.1.0"
description = "vLLM Ascend benchmark/profile harness (v0.18.0)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.9.0",
    "torch-npu==2.9.0.post2",
    "pyyaml",   # src/getconf.py / src/gettopo.py 解析 config/*.yaml
    "httpx",    # src/client/executor.py：OpenAI 兼容流式客户端（SSE 逐 token 计时）
]

# 说明：vllm / vllm-ascend 的可编辑安装及其传依赖（含 triton-ascend==3.2.1、以及
# vllm 侧 opencv>=4.13 与 vllm-ascend 侧 numpy<2 的收敛）统一由 scripts/deploy.sh 处理，
# 它消费 config/topology.yaml 的路径/分支，并透传昇腾 PyPI 镜像与 override 保持一致。